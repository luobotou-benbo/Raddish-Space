<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reddish team</title>
<style>
  :root{
    --bg:#121212; --panel:#1b1b1b; --orange:#FF7F50;
    --text:#f2ede8; --muted:#9a938c; --border:#2a2a2a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    background-image:
      linear-gradient(rgba(255,127,80,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,127,80,.045) 1px,transparent 1px);
    background-size:34px 34px;
    color:var(--text);
    font-family:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:28px 16px 60px}
  header{margin-bottom:26px;border-bottom:1px solid var(--border);padding-bottom:18px}
  .logo{font-size:clamp(24px,5vw,36px);font-weight:800;color:var(--orange);letter-spacing:1px}
  .cursor{display:inline-block;width:10px;height:1em;background:var(--orange);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .sub b{color:var(--orange);font-weight:600}
  .state{padding:48px 0;text-align:center;color:var(--muted);font-size:14px;grid-column:1/-1}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media (min-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s;min-width:0}
  .card:hover{border-color:var(--orange);transform:translateY(-3px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-size:16px;font-weight:700;word-break:break-all;min-width:0}
  .ver{flex-shrink:0;font-size:11px;color:var(--orange);border:1px solid var(--orange);border-radius:6px;padding:2px 8px;white-space:nowrap}
  .desc{color:var(--muted);font-size:13px;line-height:1.6;word-break:break-all;flex:1}
  .btn{display:block;text-align:center;text-decoration:none;background:var(--orange);color:#121212;font-weight:700;border-radius:8px;padding:11px 10px;font-size:14px;transition:box-shadow .2s,filter .2s}
  .btn:hover{box-shadow:0 0 18px rgba(255,127,80,.45);filter:brightness(1.06)}
  .btn:active{transform:scale(.98)}
  .btn.disabled{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Reddish team<span class="cursor"></span></div>
  </header>
  <main id="apps" class="grid">
    <div class="state">加载中...</div>
  </main>
</div>
<script>
(async function () {
  const box = document.getElementById('apps');
  let apps = [];
  try {
    const res = await fetch('/api/apps');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    apps = Array.isArray(data) ? data : [];
  } catch (e) {
    box.innerHTML = '<div class="state">加载失败：' + String(e.message || e) + '</div>';
    return;
  }
  if (apps.length === 0) {
    box.innerHTML = '<div class="state">暂无应用</div>';
    return;
  }
  box.innerHTML = '';
  for (const app of apps) {
    const card = document.createElement('div');
    card.className = 'card';

    const top = document.createElement('div');
    top.className = 'card-top';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = app.name || '未命名';
    const ver = document.createElement('span');
    ver.className = 'ver';
    ver.textContent = 'v' + (app.version || '1.0.0');
    top.appendChild(name);
    top.appendChild(ver);

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = app.description || '暂无介绍';

    const btn = document.createElement('a');
    btn.className = 'btn';
    btn.textContent = '⬇ 下载APK';
    if (app.downloadUrl) {
      // 兜底强制 HTTPS：http:// 一律升级为 https://
      btn.href = app.downloadUrl.replace(/^http:\/\//i, 'https://');
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
    } else {
      btn.href = '#';
      btn.classList.add('disabled');
    }

    card.appendChild(top);
    card.appendChild(desc);
    card.appendChild(btn);
    box.appendChild(card);
  }
})();
</script>
</body>
</html>
